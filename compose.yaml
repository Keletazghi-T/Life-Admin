services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: life_admin
      POSTGRES_USER: life_admin
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life_admin -d life_admin"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
