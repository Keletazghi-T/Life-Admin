plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.lifeadmin'
version = '0.1.0'
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation('io.zonky.test:embedded-postgres:2.2.2') {
        exclude group: 'io.zonky.test.postgres'
    }
    // Download only the native PostgreSQL binary for the machine running the tests.
    def os = System.getProperty('os.name').toLowerCase()
    def platform = os.contains('mac') ? 'darwin' : os.contains('win') ? 'windows' : 'linux'
    def arch = System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'arm64v8' : 'amd64'
    testRuntimeOnly "io.zonky.test.postgres:embedded-postgres-binaries-${platform}-${arch}:17.11.0"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') {
    useJUnitPlatform()
    // Automated tests must never inherit a real developer credential.
    environment 'OPENAI_API_KEY', ''
    // Embedded initdb needs a locale available on the host, including macOS.
    environment 'LC_ALL', 'C'
    environment 'LANG', 'C'
}

// Explicit, isolated browser harness; test-classpath-only HTTP mocks, never real credits.
tasks.register('receiptAiBrowser', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lifeadmin.browser.ReceiptAiBrowserApplication'
    environment 'OPENAI_API_KEY', ''
}

// Resume this workspace's existing preview with terminal-inherited credentials; no data reset.
tasks.register('receiptPreview', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lifeadmin.browser.LocalReceiptPreviewApplication'
    args rootProject.projectDir.parentFile.absolutePath
}
